<!doctype html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Profile Manager</title>
	<style>
		:root {
			--page: #f5f7fa;
			--panel: #ffffff;
			--line: #d7dee8;
			--text: #1f2933;
			--muted: #66788a;
			--blue: #357bb8;
			--blue-dark: #256092;
			--danger: #a94442;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--page);
			color: var(--text);
			font-family: Arial, Helvetica, sans-serif;
			font-size: 14px;
		}

		header {
			background: var(--panel);
			border-bottom: 1px solid var(--line);
		}

		.header-inner {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 18px;
			max-width: 1120px;
			margin: 0 auto;
			padding: 14px 18px;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 12px;
			min-width: 0;
		}

		.brand img {
			width: 48px;
			height: 48px;
			object-fit: contain;
		}

		.brand h1 {
			margin: 0;
			font-size: 18px;
			font-weight: 700;
			color: var(--blue);
		}

		.header-actions {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		main {
			max-width: 1120px;
			margin: 0 auto;
			padding: 18px;
		}

		.workspace {
			display: grid;
			grid-template-columns: minmax(280px, 430px) minmax(0, 1fr);
			gap: 18px;
			align-items: start;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 6px;
		}

		.panel-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			border-bottom: 1px solid var(--line);
			padding: 12px 14px;
		}

		.panel-title {
			margin: 0;
			font-size: 15px;
			font-weight: 700;
		}

		form {
			padding: 14px;
		}

		.form-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.field-full {
			grid-column: 1 / -1;
		}

		label {
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
		}

		input,
		select {
			width: 100%;
			height: 36px;
			border: 1px solid #c7d1dc;
			border-radius: 4px;
			background: #fff;
			color: var(--text);
			font: inherit;
			padding: 7px 9px;
		}

		input:focus,
		select:focus {
			border-color: var(--blue);
			outline: 2px solid rgba(53, 123, 184, 0.16);
		}

		.photo-row {
			display: grid;
			grid-template-columns: 94px minmax(0, 1fr);
			gap: 12px;
			align-items: center;
			margin-top: 12px;
		}

		.preview {
			width: 94px;
			height: 108px;
			border: 1px solid #c7d1dc;
			border-radius: 4px;
			background: #edf1f6;
			object-fit: cover;
		}

		.form-actions,
		.list-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin-top: 14px;
		}

		button,
		.button-link {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 34px;
			border: 1px solid var(--blue);
			border-radius: 4px;
			background: #fff;
			color: var(--blue);
			cursor: pointer;
			font: inherit;
			font-weight: 700;
			padding: 7px 11px;
			text-decoration: none;
		}

		button.primary {
			background: var(--blue);
			color: #fff;
		}

		button.primary:hover {
			background: var(--blue-dark);
		}

		button.danger {
			border-color: var(--danger);
			color: var(--danger);
		}

		.status {
			min-height: 18px;
			margin-top: 10px;
			color: var(--blue);
			font-size: 12px;
			font-weight: 700;
		}

		.status.error {
			color: var(--danger);
		}

		.search-row {
			padding: 14px;
			border-bottom: 1px solid var(--line);
		}

		.profile-list {
			display: grid;
			gap: 10px;
			padding: 14px;
		}

		.profile-item {
			display: grid;
			grid-template-columns: 54px minmax(0, 1fr) auto;
			gap: 11px;
			align-items: center;
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 10px;
			background: #fbfcfe;
		}

		.profile-item img {
			width: 54px;
			height: 62px;
			border-radius: 4px;
			object-fit: cover;
			background: #edf1f6;
		}

		.profile-name {
			font-weight: 700;
			overflow-wrap: anywhere;
		}

		.profile-meta {
			color: var(--muted);
			font-size: 12px;
			line-height: 1.45;
			overflow-wrap: anywhere;
		}

		.empty-state {
			color: var(--muted);
			padding: 20px 14px;
			text-align: center;
		}

		@media (max-width: 820px) {
			.header-inner,
			.workspace {
				display: block;
			}

			.header-actions {
				margin-top: 12px;
			}

			.panel + .panel {
				margin-top: 18px;
			}
		}

		@media (max-width: 520px) {
			.form-grid,
			.photo-row,
			.profile-item {
				grid-template-columns: 1fr;
			}

			.preview,
			.profile-item img {
				width: 115px;
				height: 125px;
			}
		}
	</style>
</head>

	<main>
		<div class="workspace">
			<section class="panel">
				<div class="panel-header">
					<h2 class="panel-title">Create Profile</h2>
				</div>
				<form id="profileForm">
					<input type="hidden" id="editingPermitNumber">
					<div class="form-grid">
						<div class="field">
							<label for="surname">Surname</label>
							<input id="surname" name="surname" required>
						</div>
						<div class="field">
							<label for="firstName">First name</label>
							<input id="firstName" name="firstName" required>
						</div>
						<div class="field field-full">
							<label for="employerName">Name of Employer</label>
							<input id="employerName" name="employerName" required>
						</div>
						<div class="field field-full">
							<label for="postHeld">Post Held</label>
							<input id="postHeld" name="postHeld" required>
						</div>
						<div class="field">
							<label for="passportNumber">Passport Number</label>
							<input id="passportNumber" name="passportNumber" required>
						</div>
						<div class="field">
							<label for="permitNumber">Permit Number</label>
							<input id="permitNumber" name="permitNumber" required>
						</div>
						<div class="field">
							<label for="dateOfBirth">Date of Birth</label>
							<input id="dateOfBirth" name="dateOfBirth" placeholder="DD/MM/YYYY" required>
						</div>
						<div class="field">
							<label for="gender">Gender</label>
							<select id="gender" name="gender" required>
								<option value="male">male</option>
								<option value="female">female</option>
							</select>
						</div>
						<div class="field">
							<label for="validityFrom">Validity From</label>
							<input id="validityFrom" name="validityFrom" placeholder="DD/MM/YYYY" required>
						</div>
						<div class="field">
							<label for="validityTo">Validity To</label>
							<input id="validityTo" name="validityTo" placeholder="DD/MM/YYYY" required>
						</div>
						<div class="field">
							<label for="status">Status</label>
							<select id="status" name="status">
								<option value="Active">Active</option>
								<option value="Inactive">Inactive</option>
							</select>
						</div>
